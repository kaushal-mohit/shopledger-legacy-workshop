<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order placement flow</title>
  <desc id="desc">A diagram showing the browser UI, Express server, all four route modules, all ten library modules, config.js, data/db.json, and the numbered place-order flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="orderArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:750}.subtitle{font-size:16px;fill:#64748b}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.groupTitle{font-size:18px;font-weight:700;fill:#475569;letter-spacing:.06em}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.7;rx:12}.ui{fill:#eff6ff;stroke:#60a5fa}.server{fill:#f1f5f9;stroke:#64748b}.route{fill:#f5f3ff;stroke:#8b5cf6}.lib{fill:#ecfdf5;stroke:#10b981}.data{fill:#fff7ed;stroke:#f59e0b}.config{fill:#fdf2f8;stroke:#ec4899}
      .boxTitle{font-size:18px;font-weight:700}.boxSub{font-size:13px;fill:#64748b}.filename{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;font-weight:700}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.edgeLight{fill:none;stroke:#94a3b8;stroke-width:1.7;marker-end:url(#arrow)}
      .order{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#orderArrow)}.orderDash{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#orderArrow)}
      .step{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.stepNum{font-size:16px;font-weight:800;fill:#b45309}.stepText{font-size:13px;font-weight:650;fill:#7c2d12}
      .legend{font-size:13px;fill:#475569}
    </style>
  </defs>
  <rect width="1800" height="1160" fill="#fff"/>
  <text x="56" y="58" class="title">ShopLedger architecture</text>
  <text x="58" y="88" class="subtitle">Browser POS and records flow • Express routes • file-backed JSON data</text>

  <!-- Zones -->
  <rect x="50" y="125" width="310" height="650" rx="18" class="group"/>
  <text x="76" y="163" class="groupTitle">BROWSER UI</text>
  <rect x="395" y="125" width="260" height="650" rx="18" class="group"/>
  <text x="421" y="163" class="groupTitle">EXPRESS APP</text>
  <rect x="690" y="125" width="420" height="650" rx="18" class="group"/>
  <text x="716" y="163" class="groupTitle">ROUTES</text>
  <rect x="1145" y="125" width="420" height="650" rx="18" class="group"/>
  <text x="1171" y="163" class="groupTitle">LIB MODULES</text>
  <rect x="1600" y="125" width="150" height="650" rx="18" class="group"/>
  <text x="1626" y="163" class="groupTitle">FILES</text>

  <!-- UI boxes -->
  <rect x="85" y="220" width="240" height="110" class="box ui"/>
  <text x="110" y="254" class="boxTitle">ShopLedger UI</text>
  <text x="110" y="280" class="boxSub">public/index.html</text>
  <text x="110" y="302" class="boxSub">POS · Orders · Khata · Audit</text>
  <rect x="85" y="375" width="240" height="90" class="box ui"/>
  <text x="110" y="410" class="filename">public/js/app.js</text>
  <text x="110" y="438" class="boxSub">XHR requests + page rendering</text>
  <rect x="85" y="510" width="240" height="80" class="box ui"/>
  <text x="110" y="545" class="filename">public/css/style.css</text>
  <text x="110" y="570" class="boxSub">Visual styles</text>
  <path d="M205 330 V375" class="edgeLight"/>

  <!-- Server -->
  <rect x="430" y="220" width="190" height="95" class="box server"/>
  <text x="455" y="256" class="filename">server.js</text>
  <text x="455" y="284" class="boxSub">Express app + static files</text>
  <rect x="430" y="375" width="190" height="90" class="box config"/>
  <text x="455" y="411" class="filename">config.js</text>
  <text x="455" y="439" class="boxSub">Shop · tax · coupons · stock</text>
  <path d="M325 420 H430" class="edge"/>
  <path d="M525 315 V375" class="edgeLight"/>

  <!-- Routers -->
  <rect x="730" y="205" width="340" height="95" class="box route"/>
  <text x="756" y="240" class="filename">routes/orders.js</text>
  <text x="756" y="268" class="boxSub">Create, list, retrieve, cancel orders</text>
  <rect x="730" y="330" width="340" height="80" class="box route"/>
  <text x="756" y="363" class="filename">routes/products.js</text>
  <text x="756" y="390" class="boxSub">Catalog, stock view, active coupons</text>
  <rect x="730" y="440" width="340" height="80" class="box route"/>
  <text x="756" y="473" class="filename">routes/customers.js</text>
  <text x="756" y="500" class="boxSub">Customer balances + settlements</text>
  <rect x="730" y="550" width="340" height="95" class="box route"/>
  <text x="756" y="585" class="filename">routes/reports.js</text>
  <text x="756" y="613" class="boxSub">Dashboard · GST reconciliation · pricing preview · export</text>
  <path d="M620 255 H680 V250 H730" class="edge"/>
  <path d="M620 265 H670 V370 H730" class="edgeLight"/>
  <path d="M620 275 H660 V480 H730" class="edgeLight"/>
  <path d="M620 285 H650 V598 H730" class="edgeLight"/>

  <!-- Lib modules -->
  <rect x="1180" y="200" width="165" height="74" class="box lib"/><text x="1198" y="231" class="filename">lib/orders.js</text><text x="1198" y="255" class="boxSub">Order lifecycle</text>
  <rect x="1360" y="200" width="165" height="74" class="box lib"/><text x="1378" y="231" class="filename">lib/store.js</text><text x="1378" y="255" class="boxSub">JSON read/write + audit</text>
  <rect x="1180" y="300" width="165" height="74" class="box lib"/><text x="1198" y="331" class="filename">lib/inventory.js</text><text x="1198" y="355" class="boxSub">Stock checks + adjustment</text>
  <rect x="1360" y="300" width="165" height="74" class="box lib"/><text x="1378" y="331" class="filename">lib/pricing.js</text><text x="1378" y="355" class="boxSub">Subtotal + GST totals</text>
  <rect x="1180" y="400" width="165" height="74" class="box lib"/><text x="1198" y="431" class="filename">lib/coupons.js</text><text x="1198" y="455" class="boxSub">Coupon validation</text>
  <rect x="1360" y="400" width="165" height="74" class="box lib"/><text x="1378" y="431" class="filename">lib/tax.js</text><text x="1378" y="455" class="boxSub">HSN slabs + CGST/SGST</text>
  <rect x="1180" y="500" width="165" height="74" class="box lib"/><text x="1198" y="531" class="filename">lib/ledger.js</text><text x="1198" y="555" class="boxSub">Khata + settlements</text>
  <rect x="1360" y="500" width="165" height="74" class="box lib"/><text x="1378" y="531" class="filename">lib/invoice.js</text><text x="1378" y="555" class="boxSub">Printable HTML invoice</text>
  <rect x="1180" y="600" width="165" height="74" class="box lib"/><text x="1198" y="631" class="filename">lib/reports.js</text><text x="1198" y="655" class="boxSub">Dashboard + reconciliation</text>
  <rect x="1360" y="600" width="165" height="74" class="box lib"/><text x="1378" y="631" class="filename">lib/dates.js</text><text x="1378" y="655" class="boxSub">Date format helpers</text>

  <!-- Files -->
  <rect x="1618" y="310" width="114" height="105" class="box data"/>
  <text x="1631" y="347" class="filename" font-size="14">data/</text><text x="1631" y="371" class="filename" font-size="14">db.json</text>
  <text x="1631" y="396" class="boxSub">Products, orders,</text><text x="1631" y="411" class="boxSub">customers, audit</text>
  <path d="M1525 237 H1590 V350 H1618" class="edgeLight"/>

  <!-- Architectural relationships -->
  <path d="M1070 250 H1180" class="edgeLight"/>
  <path d="M1070 370 H1125 V337 H1180" class="edgeLight"/>
  <path d="M1070 370 H1135 V437 H1180" class="edgeLight"/>
  <path d="M1070 480 H1130 V537 H1180" class="edgeLight"/>
  <path d="M1070 598 H1120 V637 H1180" class="edgeLight"/>
  <path d="M1070 598 H1140 V537 H1360" class="edgeLight"/>
  <path d="M1345 237 H1360" class="edgeLight"/>
  <path d="M1345 337 H1360" class="edgeLight"/>
  <path d="M1435 274 V300" class="edgeLight"/>
  <path d="M1435 374 V400" class="edgeLight"/>
  <path d="M1435 474 V500" class="edgeLight"/>
  <path d="M1435 574 V600" class="edgeLight"/>
  <path d="M1525 637 H1580 V415 H1618" class="edgeLight"/>

  <!-- Order flow overlay across bottom, with numbered checkpoints -->
  <rect x="50" y="810" width="1700" height="285" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text x="78" y="850" class="groupTitle" fill="#92400e">ORDER PLACEMENT FLOW</text>
  <text x="78" y="880" class="subtitle">POST /api/orders • orange numbered path follows the checkout sequence</text>

  <g>
    <rect x="80" y="925" width="220" height="100" rx="14" class="step"/><circle cx="104" cy="949" r="15" fill="#f59e0b"/><text x="99" y="955" font-size="15" font-weight="800" fill="#fff">1</text><text x="127" y="955" class="stepText">UI sends cart</text><text x="100" y="986" class="boxSub">items · customer · mode</text><text x="100" y="1006" class="boxSub">status · coupon</text>
    <rect x="350" y="925" width="220" height="100" rx="14" class="step"/><circle cx="374" cy="949" r="15" fill="#f59e0b"/><text x="369" y="955" font-size="15" font-weight="800" fill="#fff">2</text><text x="397" y="955" class="stepText">Resolve + validate</text><text x="370" y="986" class="boxSub">product IDs · quantity</text><text x="370" y="1006" class="boxSub">sellable stock · coupon</text>
    <rect x="620" y="925" width="220" height="100" rx="14" class="step"/><circle cx="644" cy="949" r="15" fill="#f59e0b"/><text x="639" y="955" font-size="15" font-weight="800" fill="#fff">3</text><text x="667" y="955" class="stepText">Calculate totals</text><text x="640" y="986" class="boxSub">subtotal · discount</text><text x="640" y="1006" class="boxSub">tax by HSN slab</text>
    <rect x="890" y="925" width="220" height="100" rx="14" class="step"/><circle cx="914" cy="949" r="15" fill="#f59e0b"/><text x="909" y="955" font-size="15" font-weight="800" fill="#fff">4</text><text x="937" y="955" class="stepText">Khata check (if used)</text><text x="910" y="986" class="boxSub">registered customer</text><text x="910" y="1006" class="boxSub">credit limit + debit</text>
    <rect x="1160" y="925" width="220" height="100" rx="14" class="step"/><circle cx="1184" cy="949" r="15" fill="#f59e0b"/><text x="1179" y="955" font-size="15" font-weight="800" fill="#fff">5</text><text x="1207" y="955" class="stepText">Commit order + stock</text><text x="1180" y="986" class="boxSub">orders.add · inventory.reserve</text><text x="1180" y="1006" class="boxSub">audit entry</text>
    <rect x="1430" y="925" width="260" height="100" rx="14" class="step"/><circle cx="1454" cy="949" r="15" fill="#f59e0b"/><text x="1449" y="955" font-size="15" font-weight="800" fill="#fff">6</text><text x="1477" y="955" class="stepText">Persist + respond</text><text x="1450" y="986" class="boxSub">store.write(db.json)</text><text x="1450" y="1006" class="boxSub">201 response to UI</text>
    <path d="M300 975 H350" class="order"/><path d="M570 975 H620" class="order"/><path d="M840 975 H890" class="order"/><path d="M1110 975 H1160" class="order"/><path d="M1380 975 H1430" class="order"/>
  </g>
  <path d="M840 948 C900 900 965 900 1000 925" class="orderDash"/>
  <text x="900" y="915" class="legend">Khata branch applies only when paymentMode = khata</text>
  <path d="M1535 925 C1535 850 1720 820 1680 415" class="orderDash"/>
  <text x="1260" y="1068" class="legend">General wiring: solid gray arrows • order flow: orange numbered arrows</text>
</svg>
